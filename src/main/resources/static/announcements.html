<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Department Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="MainController">
<!-- Announcements Section -->
<div class="container mt-5 mb-5" id="announcements">
    <hr class="my-4">

    <form ng-submit="addAnnouncement()"
          ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

        <form ng-submit="addAnnouncement()" ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text"
                       class="form-control"
                       ng-model="newAnnouncement.title"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control"
                          rows="4"
                          ng-model="newAnnouncement.description"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date"
                       class="form-control"
                       ng-model="newAnnouncement.date"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Add Announcement
            </button>

        </form>
    </form>

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Announcements</h2>

            <div class="alert alert-info"
                 ng-if="announcements.length === 0">
                No announcements available.
            </div>

            <div class="card mb-3"
                 ng-repeat="announcement in announcements">

                <div class="card-body">

                    <h5 class="card-title">
                        {{announcement.title}}
                    </h5>

                    <p class="card-text">
                        {{announcement.message}}
                    </p>

                    <small class="text-muted">
                        Date: {{announcement.date}}
                    </small>

                </div>

            </div>

        </div>

    </div>

</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="js/app.js"></script>
</body>

</html>
