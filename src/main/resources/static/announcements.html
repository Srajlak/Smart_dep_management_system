<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Announcements - Smart Department Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="MainController">

<div class="container mt-5 mb-5" id="announcements">

    <!-- Add Announcement -->
    <div class="card shadow mb-4"
         ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

        <div class="card-body">

            <h4 class="mb-3">Add Announcement</h4>

            <form ng-submit="addAnnouncement()">

                <div class="mb-3">
                    <label class="form-label">Title</label>

                    <input type="text"
                           class="form-control"
                           ng-model="newAnnouncement.title"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>

                    <textarea class="form-control"
                              rows="4"
                              ng-model="newAnnouncement.message"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date</label>

                    <input type="datetime-local"
                           class="form-control"
                           ng-model="newAnnouncement.date"
                           required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Announcement
                </button>

            </form>

        </div>

    </div>


    <!-- Announcements List -->
    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Announcements</h2>

            <div class="alert alert-info"
                 ng-if="announcements.length === 0">

                No announcements available.

            </div>


            <!-- Announcement -->
            <div class="card mb-3"
                 ng-repeat="announcement in announcements">

                <div class="card-body">

                    <h5 class="card-title">
                        {{announcement.title}}
                    </h5>

                    <p class="card-text">
                        {{announcement.message}}
                    </p>

                    <small class="text-muted">
                        Date: {{announcement.date}}
                    </small>


                    <!-- Admin / Staff Controls -->
                    <div class="mt-3"
                         ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

                        <button class="btn btn-warning btn-sm me-2"
                                ng-click="editAnnouncement(announcement)">
                            Edit
                        </button>

                        <button class="btn btn-danger btn-sm"
                                ng-click="deleteAnnouncement(announcement.id)">
                            Delete
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- AngularJS -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

<!-- Our JavaScript -->
<script src="js/app.js"></script>

</body>
</html>
