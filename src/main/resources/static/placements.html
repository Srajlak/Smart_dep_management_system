<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Department Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="MainController">
<!-- Placements Section -->
<div class="container mt-5 mb-5" id="placements">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Placement Highlights</h2>

            <div class="alert alert-info"
                 ng-if="placements.length === 0">
                No placement records available.
            </div>

            <div class="row">

                <div class="col-md-6 mb-4"
                     ng-repeat="placement in placements">

                    <div class="card h-100 border-success">

                        <div class="card-body">

                            <h5 class="card-title">
                                {{placement.companyName}}
                            </h5>

                            <p>
                                <strong>Job Role:</strong>
                                {{placement.jobRole}}
                            </p>

                            <p>
                                <strong>Package:</strong>
                                {{placement.packageAmount}}
                            </p>

                            <p>
                                <strong>Date:</strong>
                                {{placement.placementDate}}
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <div ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

        <hr class="my-4">

        <h3 class="mb-3">Add Placement</h3>

        <form ng-submit="addPlacement()">
            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text"
                       class="form-control"
                       ng-model="newPlacement.companyName"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Role</label>
                <input type="text"
                       class="form-control"
                       ng-model="newPlacement.jobRole"
                       required>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Package</label>
                    <input type="text"
                           class="form-control"
                           ng-model="newPlacement.packageAmount"
                           placeholder="Example: 4.5 LPA"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Placement Date</label>
                    <input type="date"
                           class="form-control"
                           ng-model="newPlacement.placementDate"
                           required>
                </div>

            </div>

            <button type="submit" class="btn btn-success">
                Add Placement
            </button>

        </form>

    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
