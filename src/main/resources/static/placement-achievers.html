<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Achievers</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <!-- Your AngularJS file -->
    <script src="js/app.js"></script>
</head>

<body ng-controller="MainController">

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <div class="card-body">

            <div class="text-center mb-5">
                <h2 class="fw-bold">Placement Achievers</h2>
                <p class="text-muted">
                    Celebrating our students who achieved successful placements
                </p>
            </div>
            <!-- Add Placement Achiever - Admin/Staff Only -->
            <div ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'"
                 class="card mb-5">

                <div class="card-body">

                    <h4 class="mb-4">Add Placement Achiever</h4>

                    <form ng-submit="addAchiever()">

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text"
                                   class="form-control"
                                   ng-model="newAchiever.studentName"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Class</label>
                            <input type="text"
                                   class="form-control"
                                   ng-model="newAchiever.studentClass"
                                   placeholder="Example: II MCA"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text"
                                   class="form-control"
                                   ng-model="newAchiever.companyName"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Placement Year</label>
                            <input type="text"
                                   class="form-control"
                                   ng-model="newAchiever.placementYear"
                                   placeholder="Example: 2026"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Photo URL / Path</label>
                            <input type="text"
                                   class="form-control"
                                   ng-model="newAchiever.photoUrl"
                                   placeholder="Example: images/achievers/student1.jpg"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-success">
                            Add Achiever
                        </button>

                    </form>

                </div>

            </div>
            <!-- Achievers will appear here -->
            <div class="row">

                <div class="col-md-4 mb-4"
                     ng-repeat="achiever in achievers">

                    <div class="card h-100 shadow-sm border-0">

                        <img ng-src="{{achiever.photoUrl}}"
                             class="card-img-top"
                             style="height:350px; object-fit:contain; background:#f8f9fa; border-radius:12px 12px 0 0;"
                             alt="Placement Achiever">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                {{achiever.studentName}}
                            </h5>

                            <p class="text-muted mb-1">
                                {{achiever.studentClass}}
                            </p>

                            <p class="mb-1">
                                <strong>Company:</strong>
                                {{achiever.companyName}}
                            </p>

                            <p>
                                <strong>Placement Year:</strong>
                                {{achiever.placementYear}}
                            </p>

                        </div>

                    </div>

                </div>

            </div>

            <!-- No achievers message -->
            <div class="alert alert-info text-center"
                 ng-if="achievers.length === 0">

                No placement achievers available.

            </div>

        </div>

    </div>

</div>

</body>
</html>
