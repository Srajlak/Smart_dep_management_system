<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Department Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body ng-controller="MainController">


<div class="container mt-5 mb-5" id="events">
    <hr class="my-4">

    <!-- Add Event - Admin and Staff Only -->
    <div ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

        <h3 class="mb-3">Add Event</h3>

        <form ng-submit="addEvent()">
            <div class="mb-3">
                <label class="form-label">Event Title</label>
                <input type="text"
                       class="form-control"
                       ng-model="newEvent.title"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control"
                          rows="3"
                          ng-model="newEvent.description"
                          required></textarea>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Date</label>
                    <input type="date"
                           class="form-control"
                           ng-model="newEvent.date"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Venue</label>
                    <input type="text"
                           class="form-control"
                           ng-model="newEvent.venue"
                           required>
                </div>

            </div>

            <button type="submit" class="btn btn-warning">
                Add Event
            </button>

        </form>

    </div>

    <!-- Display Events - Everyone Can View -->
    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Department Events</h2>

            <div class="alert alert-info"
                 ng-if="events.length === 0">
                No events available.
            </div>

            <div class="row">

                <div class="col-md-6 mb-4"
                     ng-repeat="event in events">

                    <div class="card h-100 border-primary">

                        <div class="card-body">

                            <h5 class="card-title">
                                {{event.title}}
                            </h5>

                            <p class="card-text">
                                {{event.description}}
                            </p>

                            <p>
                                <strong>Date:</strong>
                                {{event.date}}
                            </p>

                            <p>
                                <strong>Venue:</strong>
                                {{event.venue}}
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="js/app.js"></script>
</body>

</html>
