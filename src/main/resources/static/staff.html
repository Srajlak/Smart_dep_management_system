<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="MainController">
<!-- Staff Section - Admin Only -->
<div class="container mt-5 mb-5"
     id="staff"
     ng-if="loggedInRole === 'ADMIN'">
    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Staff Details</h2>
            <!-- Add Staff - Admin Only -->
            <div class="card mb-4" ng-if="loggedInRole === 'ADMIN'">
                <div class="card-body">
                    <h4 class="mb-3">Add Staff</h4>

                    <form ng-submit="addStaff()">

                        <div class="row">

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Staff Name</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStaff.staffName"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email"
                                       class="form-control"
                                       ng-model="newStaff.email"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStaff.phone"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Designation</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStaff.designation"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Username</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStaff.username"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password"
                                       class="form-control"
                                       ng-model="newStaff.password"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Role</label>
                                <select class="form-select"
                                        ng-model="newStaff.role"
                                        required>
                                    <option value="">Select Role</option>
                                    <option value="STAFF">STAFF</option>
                                    <option value="ADMIN">ADMIN</option>
                                </select>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary">
                            Add Staff
                        </button>

                    </form>
                </div>
            </div>
            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-success">

                    <tr>
                        <th>S.No</th>
                        <th>Staff ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Designation</th>
                        <th>Role</th>
                        <th ng-if="loggedInRole === 'ADMIN'">Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr ng-repeat="staffMember in staff">

                        <td>{{$index + 1}}</td>

                        <td>{{staffMember.staffId}}</td>

                        <td>{{staffMember.staffName}}</td>

                        <td>{{staffMember.email}}</td>

                        <td>{{staffMember.phone}}</td>

                        <td>{{staffMember.designation}}</td>

                        <td>{{staffMember.role}}</td>
                        <td ng-if="loggedInRole === 'ADMIN'">

                            <button class="btn btn-sm btn-warning"
                                    ng-click="editStaff($index)">
                                Edit
                            </button>
                            <button class="btn btn-sm btn-danger"
                                    ng-click="deleteStaff($index)">
                                Delete
                            </button>

                        </td>

                    </tr>

                    </tbody>

                </table>


            </div>




            <div ng-if="staff.length === 0"
                 class="alert alert-info">

                No staff records found.

            </div>

        </div>

    </div>

</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
