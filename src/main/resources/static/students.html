<!DOCTYPE html>
<html lang="en" ng-app="departmentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Smart Department Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="MainController">
<div class="container mt-5"
     id="students"
     ng-if="loggedInRole === 'ADMIN' || loggedInRole === 'STAFF'">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Student Details - Admin Management</h2>

            <!-- Add Student - Admin Only -->
            <div class="card mb-4" ng-show="loggedInRole === 'ADMIN'">
                <div class="card-body">

                    <h4 class="mb-3">Add Student</h4>

                    <form ng-submit="addStudent()">

                        <div class="row">

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Register Number</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStudent.registerNumber"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Name</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStudent.name"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email"
                                       class="form-control"
                                       ng-model="newStudent.email"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStudent.phone"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Year</label>
                                <input type="number"
                                       class="form-control"
                                       ng-model="newStudent.year"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Section</label>
                                <input type="text"
                                       class="form-control"
                                       ng-model="newStudent.section"
                                       required>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary">
                            Add Student
                        </button>

                    </form>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-primary">

                    <tr>
                        <th>S.No</th>
                        <th>Register Number</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th ng-if="loggedInRole === 'ADMIN'">Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr ng-repeat="student in students">

                        <td>{{$index + 1}}</td>

                        <td>{{student.registerNumber}}</td>

                        <td>{{student.name}}</td>

                        <td>{{student.email}}</td>

                        <td>{{student.phone}}</td>

                        <td>{{student.year}}</td>

                        <td>{{student.section}}</td>
                        <td ng-if="loggedInRole === 'ADMIN'">

                            <button class="btn btn-sm btn-warning me-1"
                                    ng-click="editStudent(student)">
                                Edit
                            </button>

                            <button class="btn btn-sm btn-danger"
                                    ng-click="deleteStudent(student)">
                                Delete
                            </button>

                        </td>

                    </tr>



                    </tbody>

                </table>

            </div>

            <div ng-if="students.length === 0"
                 class="alert alert-info">

                No student records found.

            </div>

        </div>

    </div>

</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="js/app.js"></script>
</body>

</html>
